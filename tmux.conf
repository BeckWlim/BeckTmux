# Beck tmux — a quiet, Monokai-aligned workspace
#
# This is intentionally self-contained: it works with a stock tmux install and
# does not require oh-my-tmux or TPM.  If oh-my-tmux is installed later, keep
# this file as the final override (source it after the upstream config).

# -- terminal and interaction -----------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
# Advertise the same true-colour capability to applications inside tmux.
# Neovim uses COLORTERM to enable its RGB highlight path; without it, custom
# GUI-only highlights (such as the dashboard's green sections) degrade to the
# pane default foreground.
set-environment -g COLORTERM "truecolor"
set -g focus-events on
set -g escape-time 0
set -g history-limit 100000
set -g display-time 1800
set -g repeat-time 600
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set -g set-clipboard on
set -g mouse on

# Vi is the shared editing language with Neovim.  C-a is the sole tmux prefix;
# C-q remains available to Neovim's UI-layer close mappings, and C-Space
# remains available to shells, terminal applications, and input methods.
set -g status-keys vi
set -g mode-keys vi

# tmux's built-in vi-edit table gives command prompts the same two-state flow
# as Neovim: input starts in insert mode, Escape switches to navigation mode
# (including the arrow keys), and i returns to insert mode.  Keep this native
# table intact so the behavior also survives an oh-my-tmux base configuration.

# -- Monokai palette ---------------------------------------------------------
set -g @beck_bg "#272822"
set -g @beck_surface "#2f302a"
set -g @beck_cursor "#3a3d3f"
set -g @beck_border "#666666"
set -g @beck_fg "#f8f8f2"
set -g @beck_muted "#a6a69c"
set -g @beck_green "#a6e22e"
set -g @beck_cyan "#66d9ef"
set -g @beck_yellow "#e6db74"
set -g @beck_purple "#ae81ff"
set -g @beck_red "#f92672"

# One neutral base plane, with semantic colours reserved for focus/state.
set -g pane-border-style "fg=#{@beck_border},bg=#{@beck_bg}"
set -g pane-active-border-style "fg=#{@beck_border},bg=#{@beck_bg}"
set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-format "  #{?pane_active,#[fg=#{@beck_green}]◈ P#{pane_index}#[fg=#{@beck_border}],○ P#{pane_index}}  #{pane_current_command}  "
set -g window-style "fg=#{@beck_fg},bg=#{@beck_bg}"
set -g window-active-style "fg=#{@beck_fg},bg=#{@beck_bg}"
# Command prompts use the same planes as Neovim: CursorLine while inserting,
# then the editor background with a green command-mode cue after Escape.
set -g message-style "fg=#{@beck_fg},bg=#{@beck_cursor},bold"
set -g message-command-style "fg=#{@beck_green},bg=#{@beck_bg},bold"
# tmux 3.7 draws messages over the status line instead of replacing it.  Keep
# the full-width background used by earlier versions after the server upgrade.
%if "#{m/r:^(3\\.[7-9]|[4-9]\\.),#{version}}"
set -g message-style "fg=#{@beck_fg},bg=#{@beck_cursor},bold,fill=#{@beck_cursor}"
set -g message-command-style "fg=#{@beck_green},bg=#{@beck_bg},bold,fill=#{@beck_bg}"
%endif
# Match Neovim's CursorLine plane for selected scrollback text.
set -g mode-style "fg=#{@beck_fg},bg=#{@beck_cursor},bold"

# -- statusline --------------------------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-left-length 52
set -g status-right-length 80
set -g status-style "fg=#{@beck_muted},bg=#{@beck_bg}"
set -g status-left "#{?selection_present,[ VISUAL ],#{?#{m/r:(copy|view)-mode,#{pane_mode}},[ COMMAND ],[ INPUT ]}} #[fg=#{@beck_green},bold]󰆍 #S"
set -g status-right "#[fg=#{@beck_muted}]󰉋 #{b:pane_current_path} #[fg=#{@beck_border}]│ #[fg=#{@beck_cyan}]%H:%M #[fg=#{@beck_border}]│ #[fg=#{@beck_fg}]%Y-%m-%d #{?client_prefix,│ ⟐ ,}"
set -g window-status-format "#[fg=#{@beck_muted}] #I  #W "
set -g window-status-current-format "#[fg=#{@beck_green},bg=#{@beck_cursor},bold] #I  #W "
set -g window-status-separator "  "
set -g window-status-style "fg=#{@beck_muted},bg=#{@beck_bg}"
set -g window-status-current-style "fg=#{@beck_green},bg=#{@beck_cursor},bold"

# -- key grammar -------------------------------------------------------------
# Prefix + C-a is the tmux command layer.  Within it, the first letter is a
# stable family: w=workspace, r=resize, o/p=back-and-forward.
unbind -n C-Space
# Remove previous prefix bindings so reloading an attached server releases
# C-b/C-q to applications immediately.
unbind -n C-q
unbind C-q
unbind -n C-b
unbind C-b
set -g prefix C-a
set -gu prefix2
bind C-a send-prefix

# Keep the most useful oh-my-tmux-style ergonomics, expressed as one-key roles.
# r opens a one-key resize table; R remains the explicit reload command.
bind r switch-client -T resize
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"
# a cycles focus through the split panes; the border tag marks the active one.
bind a select-pane -t :.+
# Keep directional focus changes one-shot.  tmux's stock arrow bindings are
# repeatable, which leaves the prefix table armed for `repeat-time` after the
# pane changes and makes the next application keystroke feel delayed.
bind Up select-pane -U
bind Down select-pane -D
bind Left select-pane -L
bind Right select-pane -R
bind d detach-client
bind ? list-keys

# Windows and panes: mirrors Neovim's <Space>w… family.
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind x kill-pane
bind & kill-window
bind w choose-tree -Zw
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind o last-window

# Modal terminal layer.  Escape enters scrollback command mode on an ordinary
# shell screen.  Other programs (Neovim, less, fzf, and similar clients) receive
# Escape unchanged and keep ownership of their modes.
bind -n Escape if-shell -F "#{m/r:(^|/)(bash|zsh|fish|sh|dash)$,#{pane_current_command}}" "copy-mode" "send-keys Escape"

# Resize sequences: C-a r j=left, i=up, k=down, l=right.
# The table is one-shot, so the next key returns to the normal prefix table.
bind -T resize i resize-pane -U 3
bind -T resize k resize-pane -D 3
bind -T resize j resize-pane -L 5
bind -T resize l resize-pane -R 5
# Keep the original single-prefix bindings as a repeatable fallback.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind = select-layout even-horizontal
bind + select-layout even-vertical

# Command mode: vi motions move a free cursor through terminal history.  v enters
# visual selection, y copies and returns to command mode at the same cursor
# position, and i returns to live terminal input.  Lowercase
# j is a convenient, unambiguous prefix key for starting copy mode; uppercase J
# remains the repeatable downward pane resize.
unbind [
bind j copy-mode
bind ] paste-buffer
bind -T copy-mode-vi i send-keys -X cancel
bind -T copy-mode-vi v send-keys -X begin-selection
%if "#{&&:#{m/r:^(3\\.[7-9]|[4-9]\\.),#{version}},#{&&:#{!=:#{WSL_DISTRO_NAME},},#{!=:#{WT_SESSION},}}}"
# Windows Terminal can stall while processing OSC 52 clipboard writes during
# selection updates.  Under WSL, pipe through the native Windows clipboard
# bridge instead.  -C keeps this copy out of OSC 52 while still adding it to
# tmux's paste buffers; other terminals retain tmux's native clipboard path.
bind -T copy-mode-vi y send-keys -X copy-pipe -C "clip.exe"
bind -T copy-mode-vi C-c send-keys -X copy-pipe -C "clip.exe"
bind -T copy-mode-vi Enter send-keys -X copy-pipe -C "clip.exe"
%else
bind -T copy-mode-vi y send-keys -X copy-selection
# Keep Ctrl-C consistent with y while browsing scrollback: copy and clear the
# visual selection without leaving command mode or moving the history cursor.
bind -T copy-mode-vi C-c send-keys -X copy-selection
# Enter follows the same non-exiting behavior.  With no active selection,
# copy-selection is a no-op and command mode remains active.
bind -T copy-mode-vi Enter send-keys -X copy-selection
%endif
# Finalize a mouse selection without copying it.  This avoids a redundant
# clipboard update before y/C-c and keeps the selection available in visual
# mode until it is copied or explicitly cancelled with i/q.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection
bind -T copy-mode-vi C-q send-keys -X cancel
bind -T copy-mode-vi q send-keys -X cancel

# Keep the original command visible instead of replacing it with descriptive
# hints such as “(goto line)” or “(search down)”.
# tmux 3.7 adds -e (Backspace exits an empty prompt), while tmux 3.6 added -l
# (use the prompt literally, without inserting a separating space).  Keep the
# 3.4 forms available while the existing server finishes its current sessions.
%if "#{m/r:^(3\\.[7-9]|[4-9]\\.),#{version}}"
bind -T copy-mode-vi : command-prompt -el -p ":" { send-keys -X goto-line "%%" }
bind -T copy-mode-vi / command-prompt -el -T search -p "/" { send-keys -X search-forward "%%" }
%else
bind -T copy-mode-vi : command-prompt -p ":" { send-keys -X goto-line "%%" }
bind -T copy-mode-vi / command-prompt -T search -p "/" { send-keys -X search-forward "%%" }
%endif
bind -T copy-mode-vi ? command-prompt -T search -p "?" { send-keys -X search-backward "%%" }
bind -T copy-mode-vi f command-prompt -1 -p "f" { send-keys -X jump-forward "%%" }
bind -T copy-mode-vi t command-prompt -1 -p "t" { send-keys -X jump-to-forward "%%" }
bind -T copy-mode-vi F command-prompt -1 -p "F" { send-keys -X jump-backward "%%" }
bind -T copy-mode-vi T command-prompt -1 -p "T" { send-keys -X jump-to-backward "%%" }

# Keep terminals readable and reduce visual noise.
set -g allow-passthrough on
set -g status-left-style "fg=#{@beck_muted},bg=#{@beck_bg}"
set -g status-right-style "fg=#{@beck_muted},bg=#{@beck_bg}"
set -g pane-active-border-style "fg=#{@beck_border},bg=#{@beck_bg}"

# Optional oh-my-tmux handoff: if an upstream config is sourced before this
# file, these settings remain the final, local policy.
